name: Manager targeted regressions
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linkedin-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock=false --ignore-scripts
      - name: Run failing LinkedIn suites
        run: npx tsx scripts/test-with-postgres.ts src/server/linkedin/guard.test.ts src/server/linkedin/api.test.ts --reporter=json --outputFile=manager-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-regression-results
          path: manager-results.json
          retention-days: 3
