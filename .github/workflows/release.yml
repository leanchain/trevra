name: Release and deploy

on:
  workflow_run:
    workflows: ['Container image']
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA whose sha-<SHA> image is already in GHCR (blank = current commit)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.release.outputs.current }}
      sha: ${{ steps.release.outputs.sha }}
      app_version: ${{ steps.release.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: release
        name: Resolve immutable release versions
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch --force origin main:refs/remotes/origin/main
          SHA="$(git rev-parse HEAD)"

          # workflow_run can finish after main has moved on. Never deploy an
          # older successful image automatically just because it completed
          # later. Manual dispatch remains the explicit rollback/redeploy path.
          if [[ "${{ github.event_name }}" == "workflow_run" && "$SHA" != "$(git rev-parse origin/main)" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded release $SHA; main is $(git rev-parse origin/main)."
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

          next_patch() {
            local version="$1" major minor patch
            IFS=. read -r major minor patch <<<"$version"
            if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ || ! "$patch" =~ ^[0-9]+$ ]]; then
              echo "invalid semver: $version" >&2
              exit 1
            fi
            printf '%s.%s.%s\n' "$major" "$minor" "$((patch + 1))"
          }

          existing_app_tag="$(git tag --points-at "$SHA" --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          if [[ -n "$existing_app_tag" ]]; then
            app_version="${existing_app_tag#v}"
          else
            latest_app_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
            app_base="${latest_app_tag#v}"
            [[ -n "$app_base" ]] || app_base="$(jq -r .version package.json)"
            app_version="$(next_patch "$app_base")"
          fi

          {
            echo "sha=$SHA"
            echo "app_version=$app_version"
          } >> "$GITHUB_OUTPUT"

          echo "App release: v$app_version"

  deploy_oracle:
    name: Deploy Oracle production
    needs: prepare
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    outputs:
      deployed: ${{ steps.fresh.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - id: fresh
        name: Verify release is still current main
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --force origin main:refs/remotes/origin/main
          if [[ "$SHA" == "$(git rev-parse origin/main)" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded Oracle rollout for $SHA; main is $(git rev-parse origin/main)."
          fi
      - name: Install production SSH identity
        if: steps.fresh.outputs.current == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/oracle"
          chmod 600 "$RUNNER_TEMP/ssh/oracle"
      - name: Verify immutable image exists
        if: steps.fresh.outputs.current == 'true'
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:sha-${SHA}" >/dev/null
      - name: Resolve companion version
        # companion.yml builds and publishes trevra-cli independently (see
        # that workflow for why) and is triggered by the same push. If this
        # SHA touched companion code, wait for its release + npm publish to
        # land before advertising a version to the relay that nobody can
        # install yet -- see deploy-micro.sh's TREVRA_COMPANION_RELEASE_VERSION
        # comment for why that ordering matters.
        if: steps.fresh.outputs.current == 'true'
        id: companion
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          latest_tag="$(git tag --list 'companion-v*' --sort=-v:refname | head -n1)"
          if [[ -n "$latest_tag" ]] && git diff --quiet "$latest_tag".."$SHA" -- \
            packages/trevra-cli/bin \
            packages/trevra-cli/lib \
            packages/trevra-cli/package.json \
            packages/trevra-cli/README.md; then
            version="${latest_tag#companion-v}"
            echo "No companion change since ${latest_tag}; using it as-is."
          else
            echo "Companion changed since ${latest_tag:-the beginning}; waiting for the 'Companion release' workflow to publish companion-v* for ${SHA}..."
            version=""
            for _ in $(seq 1 40); do
              git fetch --force --tags origin >/dev/null 2>&1
              tag="$(git tag --points-at "$SHA" --list 'companion-v*' | head -n1)"
              if [[ -n "$tag" ]]; then
                version="${tag#companion-v}"
                break
              fi
              sleep 15
            done
            if [[ -z "$version" ]]; then
              echo "No companion-v* release appeared for ${SHA} within 10 minutes; check the 'Companion release' workflow run for this commit." >&2
              exit 1
            fi
          fi

          echo "==> waiting for npm to serve trevra@${version}"
          for _ in $(seq 1 20); do
            if npm view "trevra@${version}" version >/dev/null 2>&1; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "trevra@${version} is not visible on npm yet; the relay must not advertise a version nobody can install." >&2
          exit 1
      - name: Guarded Oracle rollout
        if: steps.fresh.outputs.current == 'true'
        env:
          APP_IP: ${{ vars.ORACLE_APP_IP }}
          DB_IP: ${{ vars.ORACLE_DB_IP }}
          DB_PRIVATE_IP: ${{ vars.ORACLE_DB_PRIVATE_IP }}
          SHA: ${{ needs.prepare.outputs.sha }}
          COMPANION_VERSION: ${{ steps.companion.outputs.version }}
        run: |
          set -euo pipefail
          SSH_KEY="$RUNNER_TEMP/ssh/oracle" \
            ./infra/oracle/deploy-micro.sh \
              "$APP_IP" "$DB_IP" "$DB_PRIVATE_IP" "sha-${SHA}" "$COMPANION_VERSION"
      - name: Public health check
        if: steps.fresh.outputs.current == 'true'
        # Run from the app box itself, not the GitHub-hosted runner: Cloudflare's
        # Bot Fight Mode issues curl-from-a-datacenter-ASN (GitHub Actions is
        # Azure/AS8075) a Managed Challenge it cannot solve, which comes back as
        # a 403 having never reached the app -- see the deploy runs that failed
        # this step in ~90ms while the app itself was already healthy. SSHing in
        # and curling from Oracle's egress still exercises the real public path
        # (DNS, edge TLS, tunnel), just from an IP Cloudflare doesn't flag.
        env:
          APP_IP: ${{ vars.ORACLE_APP_IP }}
        run: |
          set -euo pipefail
          body="$(ssh -i "$RUNNER_TEMP/ssh/oracle" -o StrictHostKeyChecking=accept-new "ubuntu@${APP_IP}" \
            'curl --fail --silent --show-error --retry 6 --retry-delay 5 https://app.usetrevra.com/api/health')"
          jq -e '.ok == true' <<<"$body" >/dev/null

  app_release:
    name: Publish app release
    needs: [prepare, deploy_oracle]
    if: needs.deploy_oracle.result == 'success' && needs.deploy_oracle.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add release aliases to the immutable image
        env:
          VERSION: ${{ needs.prepare.outputs.app_version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create \
            -t "${image}:${VERSION}" \
            -t "${image}:v${VERSION}" \
            "${image}:sha-${SHA}"
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.app_version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists."
          else
            gh release create "$tag" --target "$SHA" --generate-notes --title "Trevra ${VERSION}"
          fi
