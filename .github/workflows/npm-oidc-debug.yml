name: npm OIDC exchange debug

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC id_token and exchange with npm
        run: |
          set -euo pipefail
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          ID_TOKEN=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r '.value')
          echo "Got id_token, length: ${#ID_TOKEN}"
          echo "--- decoded claims (unverified) ---"
          echo "$ID_TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq . || echo "$ID_TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq .
          echo "--- exchange response ---"
          curl -sS -w "\nHTTP_STATUS:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/trevra
