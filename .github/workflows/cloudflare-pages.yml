name: Cloudflare marketing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Marketing build
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      VITE_HOSTED_APP_URL: ${{ vars.HOSTED_APP_URL }}
      VITE_GITHUB_URL: ${{ vars.PUBLIC_GITHUB_URL }}
      VITE_SUPPORT_EMAIL: ${{ vars.PUBLIC_SUPPORT_EMAIL }}
      VITE_CATALOG_API_URL: ${{ vars.CATALOG_API_URL }}
      # Read by scripts/prerender-marketing.tsx and scripts/build-marketing-seo.ts,
      # not by Vite: without them the build injects an empty verification meta and
      # falls back to security@<host>.
      SECURITY_CONTACT_EMAIL: ${{ vars.SECURITY_CONTACT_EMAIL }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run build:marketing
      - uses: actions/upload-artifact@v4
        with:
          name: trevra-marketing-${{ github.sha }}
          path: dist
          retention-days: 7

  deploy:
    name: Marketing deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: marketing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trevra-marketing-${{ github.sha }}
          path: dist
      - name: Validate deployment configuration
        env:
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID"
          test -n "$CF_API_TOKEN"
          test -n "$CF_PROJECT"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}
