name: NPM package

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version in packages/trevra-cli/package.json"
        required: true
        default: false
        type: boolean

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/trevra-cli/package-lock.json
      - name: Install CLI dependencies
        working-directory: packages/trevra-cli
        run: npm ci
      - name: Audit CLI production dependencies
        working-directory: packages/trevra-cli
        run: npm audit --omit=dev
      - name: Verify package contents
        working-directory: packages/trevra-cli
        run: npm pack --dry-run
      - name: Verify CLI starts
        working-directory: packages/trevra-cli
        run: node bin/trevra.js --version

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/cli-v') || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/trevra-cli/package-lock.json
      - name: Install CLI dependencies
        working-directory: packages/trevra-cli
        run: npm ci
      - name: Ensure OIDC-capable npm
        run: npm install --global npm@11
      - name: Publish Trevra CLI
        working-directory: packages/trevra-cli
        run: npm publish --access public
