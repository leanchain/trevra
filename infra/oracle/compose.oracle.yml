# Hosted Trevra production stack for one Oracle A1 instance.
# Public traffic arrives only through Cloudflare Tunnel. Postgres data lives on
# /mnt/data, and a one-shot migration service must succeed before API/worker
# containers are recreated.

name: trevra

x-trevra-common: &trevra-common
  image: ghcr.io/leanchain/trevra:${TREVRA_IMAGE_TAG:-main}
  env_file:
    - .env.oracle
  environment:
    NODE_ENV: production
    TREVRA_DEPLOYMENT_MODE: hosted
    DATABASE_AUTO_MIGRATE: "false"
    DATABASE_URL: postgresql://trevra:${TREVRA_DB_PASSWORD:?Set TREVRA_DB_PASSWORD}@postgres:5432/trevra
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: trevra
      POSTGRES_USER: trevra
      POSTGRES_PASSWORD: ${TREVRA_DB_PASSWORD:?Set TREVRA_DB_PASSWORD}
    volumes:
      - /mnt/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trevra -d trevra"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *trevra-common
    command: ["node", "dist-server/server/migrate-job.js"]
    environment:
      NODE_ENV: production
      TREVRA_DEPLOYMENT_MODE: hosted
      DATABASE_AUTO_MIGRATE: "false"
      PORT: 8082
      DATABASE_URL: postgresql://trevra:${TREVRA_DB_PASSWORD:?Set TREVRA_DB_PASSWORD}@postgres:5432/trevra
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  trevra:
    <<: *trevra-common
    environment:
      NODE_ENV: production
      TREVRA_DEPLOYMENT_MODE: hosted
      DATABASE_AUTO_MIGRATE: "false"
      TREVRA_COMPANION_RELAY_URL: ws://trevra:8080
      PORT: 8080
      DATABASE_URL: postgresql://trevra:${TREVRA_DB_PASSWORD:?Set TREVRA_DB_PASSWORD}@postgres:5432/trevra
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    <<: *trevra-common
    command: ["node", "dist-server/worker/index.js"]
    environment:
      NODE_ENV: production
      TREVRA_DEPLOYMENT_MODE: hosted
      DATABASE_AUTO_MIGRATE: "false"
      TREVRA_COMPANION_RELAY_URL: ws://trevra:8080
      PORT: 8081
      DATABASE_URL: postgresql://trevra:${TREVRA_DB_PASSWORD:?Set TREVRA_DB_PASSWORD}@postgres:5432/trevra
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  cloudflared:
    image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      trevra:
        condition: service_healthy
    restart: unless-stopped
