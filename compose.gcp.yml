# Cloud Run Compose is a preview deployment path. For production use infra/gcp/terraform.
# Required shell variables: GCP_IMAGE, CLOUD_SQL_INSTANCE, DATABASE_URL,
# APP_ORIGIN, BETTER_AUTH_URL, BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET, PUBLIC_LEGAL_NAME, PUBLIC_SUPPORT_EMAIL,
# SECURITY_CONTACT_EMAIL, MARKETING_HASH_SALT, TRACTION_ADMIN_TOKEN,
# INDEXNOW_KEY, NANGO_API_KEY, and NANGO_WEBHOOK_SIGNING_KEY.
name: trevra-cloud-run

services:
  trevra:
    image: ${GCP_IMAGE}
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      TREVRA_ORCHESTRATOR: ${TREVRA_ORCHESTRATOR:-postgres}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-trevra-playbooks}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-true}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      PUBLIC_REGISTRY_CORS_ORIGIN: ${PUBLIC_REGISTRY_CORS_ORIGIN:-${APP_ORIGIN:-http://localhost:43173}}
      PUBLIC_REGISTRY_API_URL: ${PUBLIC_REGISTRY_API_URL:-${APP_ORIGIN}}
      TREVRA_SANDBOX_GATEWAY_URL: ${TREVRA_SANDBOX_GATEWAY_URL:-}
      TREVRA_SANDBOX_GATEWAY_TOKEN: ${TREVRA_SANDBOX_GATEWAY_TOKEN:-}
      TREVRA_REMOTE_ACTION_ADAPTERS_JSON: ${TREVRA_REMOTE_ACTION_ADAPTERS_JSON:-[]}
      TREVRA_REMOTE_ACTION_ADAPTER_TOKEN: ${TREVRA_REMOTE_ACTION_ADAPTER_TOKEN:-}
      APP_ORIGIN: ${APP_ORIGIN}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-${APP_ORIGIN}}
      PUBLIC_LEGAL_NAME: ${PUBLIC_LEGAL_NAME}
      PUBLIC_SUPPORT_EMAIL: ${PUBLIC_SUPPORT_EMAIL}
      SECURITY_CONTACT_EMAIL: ${SECURITY_CONTACT_EMAIL}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      MARKETING_HASH_SALT: ${MARKETING_HASH_SALT}
      TRACTION_ADMIN_TOKEN: ${TRACTION_ADMIN_TOKEN}
      TREVRA_AGENT_TOKEN_PEPPER: ${TREVRA_AGENT_TOKEN_PEPPER}
      INDEXNOW_KEY: ${INDEXNOW_KEY}
      COOKIE_SECURE: "true"
      NANGO_HOST: ${NANGO_HOST}
      NANGO_PUBLIC_SERVER_URL: ${NANGO_HOST}
      NANGO_API_KEY: ${NANGO_API_KEY}
      NANGO_WEBHOOK_SIGNING_KEY: ${NANGO_WEBHOOK_SIGNING_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      INGEST_API_KEY: ${INGEST_API_KEY}
      ALLOW_DEMO_AUTH: "false"
      ALLOW_SIMULATED_EXECUTION: "false"
    depends_on:
      - cloud-sql-proxy
    x-google-cloudrun:
      ingress-container: true
    cpus: 2

  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
    command:
      - "--structured-logs"
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUD_SQL_INSTANCE}"
    expose:
      - "5432"
    cpus: 1
