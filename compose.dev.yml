name: trevra-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trevra
      POSTGRES_USER: trevra
      POSTGRES_PASSWORD: ${TREVRA_DB_PASSWORD:-trevra-local-password}
    ports:
      - '${TREVRA_DB_PORT:-45432}:5432'
    volumes:
      - trevra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trevra -d trevra']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  trevra:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # THE HOST'S GPU, FOR THE BROWSER'S WEBGL AND NOTHING ELSE.
    #
    # Chrome draws into this container's Xvfb display (see Dockerfile.dev).
    # With a render node it reports the real card -- "ANGLE (Intel, Mesa
    # Intel(R) Graphics ...)" -- exactly as it does on the host. Without one it
    # falls back to Mesa's llvmpipe, which is what a GPU-less cloud desktop
    # reports and is still far better than the SwiftShader that headless gives
    # you on a machine WITH a GPU.
    #
    # DELETE THESE TWO LINES on a machine with no /dev/dri -- an Oracle Cloud VM,
    # most CI. Docker refuses to start a container whose device does not exist,
    # and llvmpipe needs nothing.
    devices:
      - /dev/dri:/dev/dri
    environment:
      NODE_ENV: development
      PORT: 8787
      # Internal container ports; host mappings below use the collision-resistant values.
      TREVRA_WEB_PORT: 5173
      TREVRA_API_PORT: 8787
      # Vite runs on 5173 inside Docker, but the browser connects through the
      # host-mapped port. Give its HMR WebSocket the browser-facing port explicitly.
      VITE_HMR_CLIENT_PORT: ${TREVRA_WEB_PORT:-43173}
      # tsx/chokidar watchers use the same bind mount as Vite. Polling keeps API
      # and worker restarts reliable when an editor replaces a file atomically.
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '150'
      DATABASE_URL: postgresql://trevra:${TREVRA_DB_PASSWORD:-trevra-local-password}@postgres:5432/trevra
      DATABASE_POOL_MAX: 10
      TREVRA_ORCHESTRATOR: ${TREVRA_ORCHESTRATOR:-postgres}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-trevra-playbooks}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      PUBLIC_REGISTRY_CORS_ORIGIN: ${PUBLIC_REGISTRY_CORS_ORIGIN:-${APP_ORIGIN:-http://localhost:43173}}
      PUBLIC_REGISTRY_API_URL: http://localhost:${TREVRA_API_PORT:-43887}
      TREVRA_SANDBOX_GATEWAY_URL: ${TREVRA_SANDBOX_GATEWAY_URL:-}
      TREVRA_SANDBOX_GATEWAY_TOKEN: ${TREVRA_SANDBOX_GATEWAY_TOKEN:-}
      APP_ORIGIN: http://localhost:${TREVRA_WEB_PORT:-43173},http://localhost:${TREVRA_API_PORT:-43887}
      BETTER_AUTH_URL: http://localhost:${TREVRA_WEB_PORT:-43173}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-only-trevra-secret-change-before-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Trevra}
      PUBLIC_SITE_URL: http://localhost:${TREVRA_WEB_PORT:-43173}
      PUBLIC_LEGAL_NAME: ${PUBLIC_LEGAL_NAME:-Trevra}
      PUBLIC_SUPPORT_EMAIL: ${PUBLIC_SUPPORT_EMAIL:-support@trevra.local}
      SECURITY_CONTACT_EMAIL: ${SECURITY_CONTACT_EMAIL:-security@trevra.local}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      MARKETING_HASH_SALT: ${MARKETING_HASH_SALT:-development-marketing-salt-change-before-production}
      TRACTION_ADMIN_TOKEN: ${TRACTION_ADMIN_TOKEN:-development-traction-token-change-before-production}
      TREVRA_AGENT_TOKEN_PEPPER: ${TREVRA_AGENT_TOKEN_PEPPER:-development-agent-token-pepper-change-before-production}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-trevra-development-indexnow-key}
      COOKIE_SECURE: 'false'
      ALLOW_DEMO_AUTH: 'true'
      ALLOW_SIMULATED_EXECUTION: 'true'
      NANGO_HOST: http://nango-server:3003
      NANGO_PUBLIC_SERVER_URL: http://localhost:${NANGO_API_PORT:-43003}
      NANGO_API_KEY: ${NANGO_API_KEY:-}
      NANGO_WEBHOOK_SIGNING_KEY: ${NANGO_WEBHOOK_SIGNING_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TREVRA_DEPLOYMENT_MODE: ${TREVRA_DEPLOYMENT_MODE:-local}
      # LinkedIn automation is controlled by this server but Chrome lives on an
      # external browser host. In the normal self-hosted path that host is the
      # paired Companion app, which may run on this same physical machine or on
      # another one. Docker never downloads, launches, profiles, or displays Chrome.
      #
      # Set to false to switch LinkedIn automation off entirely.
      TREVRA_LINKEDIN_LOCAL: ${TREVRA_LINKEDIN_LOCAL:-true}
      # Retained for compatibility with explicitly configured remote providers.
      # Companion owns its own browser mode, so this does not create or launch a
      # browser inside Docker.
      TREVRA_LINKEDIN_HEADLESS: ${TREVRA_LINKEDIN_HEADLESS:-true}
      # Lead sourcing -- walking a people-search page or a post into a list of
      # people -- is a SECOND opt-in, and off unless this says otherwise.
      # Sending automates your own seat; harvesting profiles is scraping under
      # LinkedIn's User Agreement 8.2, and that risk is yours to accept
      # deliberately rather than inherit from switching sending on.
      TREVRA_LINKEDIN_LEAD_SOURCING: ${TREVRA_LINKEDIN_LEAD_SOURCING:-false}
      # Opens every sealed secret: model API keys, and the LinkedIn sign-in when
      # you choose that path. Without it credential storage refuses outright
      # rather than writing anything in the clear. Generate one with:
      #   openssl rand -base64 32
      TREVRA_SECRETS_KEY: ${TREVRA_SECRETS_KEY:-}
      TREVRA_SECRETS_KEY_PREVIOUS: ${TREVRA_SECRETS_KEY_PREVIOUS:-}
      # Run the hosted agent through a subscription CLI instead of a BYOK model
      # key. Empty means BYOK, which stays the default. The CLIs are installed in
      # Dockerfile.dev; the token is what signs them in, because this container
      # has no browser to log in with:
      #
      #   claude   `claude setup-token` on your machine, paste the result
      #   codex    the access token from ~/.codex/auth.json
      #
      # Self-hosted only -- the server refuses to start with TREVRA_AGENT_CLI set
      # and TREVRA_DEPLOYMENT_MODE=hosted, because a personal subscription must
      # not back other tenants' runs.
      TREVRA_AGENT_CLI: ${TREVRA_AGENT_CLI:-}
      TREVRA_AGENT_CLI_MODEL: ${TREVRA_AGENT_CLI_MODEL:-}
      TREVRA_AGENT_CLI_OAUTH_TOKEN: ${TREVRA_AGENT_CLI_OAUTH_TOKEN:-}
      TREVRA_AGENT_CLI_BIN: ${TREVRA_AGENT_CLI_BIN:-}
      TREVRA_AGENT_CLI_HOME: ${TREVRA_AGENT_CLI_HOME:-}
    ports:
      - '${TREVRA_WEB_PORT:-43173}:5173'
      - '${TREVRA_API_PORT:-43887}:8787'
    volumes:
      - ./:/app
      - trevra-node-modules:/app/node_modules
      # Every seat's signed-in browser profile. A NAMED VOLUME rather than the
      # container filesystem, because a recreate would otherwise throw the
      # session away and the next tick would sign in from scratch -- a fresh
      # login from a browser LinkedIn has never seen before is exactly the
      # event it answers with "your account shows unusual activity".
      #
      # THE WHOLE `~/.trevra`, NOT ONE PROFILE INSIDE IT. `resolveProfileDir`
      # gives every (workspace, seat) its own
      # `/root/.trevra/linkedin-<workspace>[-<seat>]-profile` (migration 045),
      # so a mount pinned at `linkedin-profile` persisted a path nothing writes
      # any more and left EVERY REAL SEAT on the ephemeral container layer --
      # a brand-new device fingerprint on every `docker compose up --build`.
      # The Reddit worker's profile lives under the same base and is persisted
      # by the same mount, for the same reason.
      - trevra-browser-profiles:/root/.trevra
    depends_on:
      postgres:
        condition: service_healthy
      nango-server:
        condition: service_healthy
    restart: unless-stopped

  temporal:
    image: temporalio/temporal:1.8.1
    profiles: ['temporal']
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--db-filename', '/data/temporal.db']
    ports:
      - '${TEMPORAL_PORT:-47233}:7233'
      - '${TEMPORAL_UI_PORT:-48233}:8233'
    volumes:
      - temporal-data:/data
    restart: unless-stopped

  nango-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nango
      POSTGRES_USER: nango
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD:-nango-local-password}
    ports:
      - '${NANGO_DB_PORT:-45433}:5432'
    volumes:
      - nango-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nango -d nango']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nango-redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    ports:
      - '${NANGO_REDIS_PORT:-46379}:6379'
    volumes:
      - nango-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nango-server:
    image: nangohq/nango-server:${NANGO_IMAGE_TAG:-hosted}
    platform: linux/amd64
    environment:
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY:?Set NANGO_ENCRYPTION_KEY in .env.dev}
      NANGO_DB_USER: nango
      NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD:-nango-local-password}
      NANGO_DB_HOST: nango-db
      NANGO_DB_PORT: 5432
      NANGO_DB_NAME: nango
      NANGO_DB_SSL: 'false'
      NANGO_DB_POOL_MIN: 1
      NANGO_DB_POOL_MAX: 10
      RECORDS_DATABASE_URL: postgresql://nango:${NANGO_DB_PASSWORD:-nango-local-password}@nango-db:5432/nango
      NANGO_REDIS_URL: redis://nango-redis:6379
      SERVER_PORT: 3003
      NANGO_CONNECT_UI_PORT: 3009
      NANGO_SERVER_URL: http://localhost:${NANGO_API_PORT:-43003}
      NANGO_PUBLIC_SERVER_URL: http://localhost:${NANGO_API_PORT:-43003}
      NANGO_PUBLIC_CONNECT_URL: http://localhost:${NANGO_CONNECT_PORT:-43009}
      FLAG_SERVE_CONNECT_UI: 'true'
      FLAG_AUTH_ENABLED: 'false'
      CSP_REPORT_ONLY: 'true'
      LOG_LEVEL: ${NANGO_LOG_LEVEL:-info}
      NANGO_LOGS_ENABLED: 'false'
    ports:
      - '${NANGO_API_PORT:-43003}:3003'
      - '${NANGO_CONNECT_PORT:-43009}:3009'
    depends_on:
      nango-db:
        condition: service_healthy
      nango-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

volumes:
  trevra-postgres-data:
  trevra-node-modules:
  trevra-browser-profiles:
  nango-postgres-data:
  nango-redis-data:
  temporal-data:
